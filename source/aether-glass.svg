<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="96" height="96">
  <!-- Aether Glass icon: a small frosted-glass window with the theme's gradient title bar.
       Source art for aether-glass.png (rendered at 96px). -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff3d9a"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="win"><rect x="5" y="9" width="54" height="46" rx="10"/></clipPath>
  </defs>
  <!-- window body: deep violet with a frosted sheen and a light rim -->
  <rect x="5" y="9" width="54" height="46" rx="10" fill="#161033"/>
  <rect x="5" y="9" width="54" height="46" rx="10" fill="url(#frost)"/>
  <!-- title bar, clipped to the window's rounded top -->
  <rect x="5" y="9" width="54" height="11" fill="url(#bar)" clip-path="url(#win)"/>
  <!-- sidebar and two content rows -->
  <rect x="12" y="27" width="12" height="21" rx="4" fill="#7c5cff" fill-opacity="0.75"/>
  <rect x="29" y="27" width="23" height="8" rx="4" fill="#ffffff" fill-opacity="0.38"/>
  <rect x="29" y="40" width="23" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
  <rect x="5" y="9" width="54" height="46" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
